<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팔아봐! 판매 성향 테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --g:#22C55E;--gd:#15803D;--gl:#DCFCE7;
    --r:#EF4444;--rd:#991B1B;--rl:#FEE2E2;--rb:#FECACA;
    --b:#3B82F6;--bd:#1E3A8A;--bl:#DBEAFE;--bb:#BFDBFE;
    --bg:#F8FAFC;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--border:#E2E8F0;
  }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px 48px; }
  #app { width:100%; max-width:420px; }
  .screen { display:none; }
  .screen.active { display:block; }

  .intro-top { text-align:center; padding:2rem 0 1.5rem; }
  .logo-ring { width:72px;height:72px;background:linear-gradient(135deg,#22C55E,#3B82F6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 1rem;box-shadow:0 8px 24px rgba(34,197,94,0.3); }
  .intro-eyebrow { font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--g);text-transform:uppercase;margin-bottom:8px; }
  .intro-title { font-size:26px;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:10px; }
  .intro-sub { font-size:14px;color:var(--muted);line-height:1.7; }
  .team-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1.5rem 0; }
  .team-card { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;transition:transform 0.15s; }
  .team-card:hover { transform:translateY(-2px); }
  .tc-emoji { font-size:24px;margin-bottom:6px; }
  .tc-name { font-size:12px;font-weight:700;color:var(--text); }
  .tc-zh { font-size:11px;color:var(--muted);margin-top:2px; }
  .tc-types { font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5; }
  .mix-note { background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:12px 14px;font-size:12px;color:var(--gd);line-height:1.6;margin-bottom:1.5rem;text-align:center; }
  .meta-row { display:flex;justify-content:center;gap:20px;margin-bottom:1.2rem; }
  .meta-item { display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted); }
  .meta-dot { width:6px;height:6px;border-radius:50%;background:var(--g); }
  .start-btn { display:block;width:100%;padding:16px;background:var(--g);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:background 0.15s,transform 0.1s;box-shadow:0 4px 16px rgba(34,197,94,0.35); }
  .start-btn:hover { background:var(--gd);transform:translateY(-1px); }
  .start-btn:active { transform:scale(0.98); }

  .prog-header { display:flex;align-items:center;gap:12px;margin-bottom:1.5rem; }
  .prog-wrap { flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden; }
  .prog-fill { height:6px;border-radius:99px;background:linear-gradient(90deg,var(--g),#3B82F6);transition:width 0.4s ease; }
  .prog-text { font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap; }
  .q-card { background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.5rem;margin-bottom:1rem; }
  .q-num { font-size:11px;font-weight:700;color:var(--g);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px; }
  .q-text { font-size:16px;font-weight:700;color:var(--text);line-height:1.5; }
  .opts { display:flex;flex-direction:column;gap:10px; }
  .opt-btn { background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;line-height:1.45;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s; }
  .opt-btn:hover { border-color:var(--g);background:#F0FDF4;color:var(--gd); }
  .opt-btn.sel { border-color:var(--g);background:var(--gl);color:var(--gd);font-weight:700; }

  .loading-wrap { text-align:center;padding:3rem 1rem; }
  .spinner { width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-txt { font-size:14px;color:var(--muted); }

  .type-hero { border-radius:20px;padding:1.8rem 1.2rem;text-align:center;margin-bottom:1.2rem; }
  .r-em { font-size:48px;margin-bottom:10px;display:block; }
  .r-eyebrow { font-size:11px;font-weight:700;letter-spacing:1.2px;margin-bottom:6px;text-transform:uppercase; }
  .r-title { font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px; }
  .r-zh { font-size:13px;color:var(--muted); }
  .r-desc { font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:1rem;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px; }
  .traits-wrap { display:flex;flex-direction:column;gap:8px;margin-bottom:1.2rem; }
  .trait-row { display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;color:var(--text); }
  .trait-icon { font-size:16px; }
  .team-result { border-radius:20px;padding:1.4rem;margin-bottom:1rem;border:2px solid; }
  .tr-top { display:flex;align-items:center;gap:12px;margin-bottom:12px; }
  .tr-em { font-size:36px; }
  .tr-label { font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px; }
  .tr-name { font-size:20px;font-weight:700;color:var(--text); }
  .tr-zh { font-size:12px;color:var(--muted); }
  .tr-divider { height:1px;background:var(--border);margin:10px 0;opacity:0.5; }
  .tr-role-label { font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500; }
  .role-pill { display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;border:1.5px solid;margin-bottom:10px; }
  .tr-members-label { font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500; }
  .members-row { display:flex;gap:6px;flex-wrap:wrap; }
  .member-chip { font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:500; }
  .member-chip.me { font-weight:700;border-width:1.5px; }
  .retry-btn { display:block;width:100%;padding:13px;background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:14px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:background 0.15s;margin-top:8px; }
  .retry-btn:hover { background:var(--bg); }
  .footer { text-align:center;margin-top:2rem;font-size:11px;color:#CBD5E1;letter-spacing:0.3px; }
</style>
</head>
<body>
<div id="app">

  <div id="screen-intro" class="screen active">
    <div class="intro-top">
      <div class="logo-ring">🏷️</div>
      <div class="intro-eyebrow">팔아봐 교수법</div>
      <div class="intro-title">나의 판매 성향은<br>무엇일까요?</div>
      <div class="intro-sub">7가지 질문으로 당신의 영업 스타일을 분석하고<br>수업 팀을 배정합니다</div>
    </div>
    <div class="team-grid">
      <div class="team-card"><div class="tc-emoji">🔴</div><div class="tc-name">알리바바</div><div class="tc-zh">阿里巴巴</div><div class="tc-types">돌격형<br>관계형<br>전략형</div></div>
      <div class="team-card"><div class="tc-emoji">🟢</div><div class="tc-name">화웨이</div><div class="tc-zh">华为</div><div class="tc-types">승부형<br>공감형<br>분석형</div></div>
      <div class="team-card"><div class="tc-emoji">🔵</div><div class="tc-name">샤오미</div><div class="tc-zh">小米</div><div class="tc-types">목표형<br>신뢰형<br>탐구형</div></div>
    </div>
    <div class="mix-note">✦ 각 팀은 서로 다른 성향이 섞여 구성됩니다<br>내 성향에 맞는 역할로 팀에 배정됩니다</div>
    <div class="meta-row">
      <div class="meta-item"><div class="meta-dot"></div>7문항</div>
      <div class="meta-item"><div class="meta-dot"></div>약 1분 소요</div>
      <div class="meta-item"><div class="meta-dot"></div>9가지 유형</div>
    </div>
    <button class="start-btn" onclick="startQuiz()">테스트 시작하기 →</button>
    <div class="footer">팔아봐 교수법 · 중국어 판매협상 수업</div>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="prog-header">
      <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
      <div class="prog-text" id="prog-text">1 / 7</div>
    </div>
    <div class="q-card">
      <div class="q-num" id="q-num">Q1</div>
      <div class="q-text" id="q-text"></div>
    </div>
    <div class="opts" id="q-opts"></div>
  </div>

  <div id="screen-loading" class="screen">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-txt">팀 배정 중...</div>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="type-hero" id="r-hero">
      <span class="r-em" id="r-em"></span>
      <div class="r-eyebrow" id="r-eyebrow">나의 판매 유형</div>
      <div class="r-title" id="r-title"></div>
      <div class="r-zh" id="r-zh"></div>
    </div>
    <div class="r-desc" id="r-desc"></div>
    <div class="traits-wrap" id="r-traits"></div>
    <div class="team-result" id="r-team">
      <div class="tr-top">
        <div class="tr-em" id="tr-em"></div>
        <div>
          <div class="tr-label" id="tr-label"></div>
          <div class="tr-name" id="tr-name"></div>
          <div class="tr-zh" id="tr-zh"></div>
        </div>
      </div>
      <div class="tr-divider"></div>
      <div class="tr-role-label">팀 내 역할</div>
      <div id="tr-role"></div>
      <div class="tr-divider"></div>
      <div class="tr-members-label">우리 팀 구성</div>
      <div class="members-row" id="tr-members"></div>
    </div>
    <button class="retry-btn" onclick="resetQuiz()">↩ 다시 하기</button>
    <div class="footer">팔아봐 교수법 · 중국어 판매협상 수업</div>
  </div>

</div>

<script>

// 각 팀은 공격+관계+전략 성향이 하나씩 섞임
// 인원 차이는 감수, 성향 혼합을 최우선으로

    { text:"상대방과의 신뢰와 관계 구축", s:{push:0,win:0,goal:0,rel:3,emp:1,trust:2,strat:0,anal:0,explore:0} },

    { text:"주변 사람들과 함께 계획한다", s:{push:0,win:0,goal:0,rel:2,emp:3,trust:2,strat:0,anal:0,explore:0} },
    { text:"자료를 모으고 분석한 뒤 움직인다", s:{push:0,win:0,goal:2,rel:0,emp:0,trust:0,strat:2,anal:3,explore:3} }
  ]},
  { text:"고객이 가격이 비싸다고 할 때 나는?", opts:[

    { text:"공감하며 대안을 부드럽게 제안한다", s:{push:0,win:0,goal:0,rel:2,emp:3,trust:2,strat:0,anal:0,explore:0} },

    { text:"자료 분석하고 전략을 설계하는 참모", s:{push:0,win:0,goal:1,rel:0,emp:0,trust:0,strat:3,anal:3,explore:2} }

const TEAMS = {
  A: { em:"🔴", name:"알리바바팀", zh:"阿里巴巴队", color:"#EF4444", light:"#FEF2F2", border:"#FECACA",
       types:["push","rel","strat"], roleMap:{push:"추진 담당 🔥", rel:"관계 담당 🤝", strat:"전략 담당 🧠"} },
  B: { em:"🟢", name:"화웨이팀",   zh:"华为队",     color:"#22C55E", light:"#F0FDF4", border:"#BBF7D0",
       types:["win","emp","anal"],  roleMap:{win:"승부 담당 ⚡", emp:"공감 담당 💛", anal:"분석 담당 📊"} },
  C: { em:"🔵", name:"샤오미팀",   zh:"小米队",     color:"#3B82F6", light:"#EFF6FF", border:"#BFDBFE",
       types:["goal","trust","explore"], roleMap:{goal:"목표 담당 🎯", trust:"신뢰 담당 🌿", explore:"탐구 담당 🔍"} }
};

const GROUP_COLORS = {
  red:   { bg:"#FEF2F2", accent:"#EF4444", text:"#991B1B" },
  green: { bg:"#F0FDF4", accent:"#22C55E", text:"#15803D" },
  blue:  { bg:"#EFF6FF", accent:"#3B82F6", text:"#1E3A8A" }
};

let scores = {}, cur = 0, myType = null, myTeam = null;

function initScores() { scores = {}; Object.keys(SUBTYPES).forEach(k => scores[k] = 0); }
function startQuiz() { initScores(); cur = 0; showScreen('quiz'); renderQ(); }

function renderQ() {
  const q = Qs[cur];
  document.getElementById('prog-text').textContent = (cur+1)+' / '+Qs.length;
  document.getElementById('prog').style.width = (cur/Qs.length*100)+'%';
  document.getElementById('q-num').textContent = 'Q'+(cur+1);
  document.getElementById('q-text').textContent = q.text;
  const el = document.getElementById('q-opts');
  el.innerHTML = '';
  q.opts.forEach((o,i) => {
    const b = document.createElement('button');
    b.className='opt-btn'; b.textContent=o.text;
    b.onclick=()=>pick(i);
    el.appendChild(b);
  });
}

function pick(i) {
  document.querySelectorAll('.opt-btn').forEach((b,j)=>j===i?b.classList.add('sel'):b.classList.remove('sel'));
  const s = Qs[cur].opts[i].s;
  Object.keys(s).forEach(k=>scores[k]+=s[k]);
  setTimeout(()=>{ cur++; cur<Qs.length?renderQ():calcResult(); }, 380);
}

function calcResult() {
  myType = Object.keys(scores).reduce((a,b)=>scores[a]>=scores[b]?a:b);
  myTeam = TYPE_TO_TEAM[myType];
  showResult();
}

function showResult() {
  const t = SUBTYPES[myType];
  const team = TEAMS[myTeam];
  const gc = GROUP_COLORS[t.group];

  const hero = document.getElementById('r-hero');
  hero.style.background = gc.bg;
  document.getElementById('r-em').textContent = t.em;
  document.getElementById('r-eyebrow').style.color = gc.accent;
  document.getElementById('r-title').textContent = t.name;
  document.getElementById('r-zh').textContent = t.zh;
  document.getElementById('r-desc').textContent = t.desc;
  document.getElementById('r-traits').innerHTML = t.traits.map(([icon,label])=>
    `<div class="trait-row"><span class="trait-icon">${icon}</span>${label}</div>`
  ).join('');

  const teamCard = document.getElementById('r-team');
  teamCard.style.borderColor = team.border;
  teamCard.style.background = team.light;
  document.getElementById('tr-em').textContent = team.em;
  document.getElementById('tr-label').style.color = team.color;
  document.getElementById('tr-label').textContent = '배정된 팀';
  document.getElementById('tr-name').textContent = team.name;
  document.getElementById('tr-zh').textContent = team.zh;
  document.getElementById('tr-role').innerHTML =
    `<span class="role-pill" style="color:${team.color};border-color:${team.border};background:${team.light}">${team.roleMap[myType]}</span>`;
  document.getElementById('tr-members').innerHTML = team.types.map(k=>{
    const st=SUBTYPES[k]; const isMe=k===myType;
    return `<span class="member-chip${isMe?' me':''}" style="${isMe?`color:${team.color};border-color:${team.color};background:${team.light}`:''}">
      ${st.em} ${st.name}${isMe?' 👈':''}</span>`;
  }).join('');

  showScreen('result');
}

function resetQuiz() { showScreen('intro'); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
